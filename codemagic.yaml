workflows:
  android-apk:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Go to project root
        script: |
          cd $CM_BUILD_DIR
          pwd
          ls
      - name: Flutter doctor
        script: |
          cd $CM_BUILD_DIR
          flutter doctor -v
      - name: Get Flutter packages
        script: |
          cd $CM_BUILD_DIR
          flutter pub get
      - name: Build APK
        script: |
          cd $CM_BUILD_DIR
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
